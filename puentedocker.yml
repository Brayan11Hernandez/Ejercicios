services:
  paginaweb1:
    image: nginx:alpine
    volumes:
      - ./paginaweb1/index.html:/usr/share/nginx/html/index.html:ro

  paginaweb2:
    image: nginx:alpine
    volumes:
      - ./paginaweb2/index.html:/usr/share/nginx/html/index.html:ro

  conector:
      image: nginx:alpine
      ports:
        - "8080:80"
      volumes:
        - ./conector/nginx.conf:/etc/nginx/nginx.conf:ro
      depends_on:
        - paginaweb1
        - paginaweb2
